version: 2
updates:
  # Zależności npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Warsaw'
    open-pull-requests-limit: 10
    assignees:
      - 'VigoWB'
    labels:
      - 'dependencies'
      - 'npm'
    allow:
      - dependency-type: 'direct'
      - dependency-type: 'indirect'
    ignore:
      # Nowe wersje GŁÓWNE (major) tych pakietów aktualizujemy ręcznie.
      # Klucz musi się nazywać "update-types" (liczba mnoga, lista) — inaczej
      # GitHub odrzuca plik albo (gorzej) wyklucza WSZYSTKIE aktualizacje pakietu.
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tailwindcss/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    # Drobne aktualizacje (minor/patch) idą w dwóch zbiorczych PR-ach zamiast
    # kilkunastu osobnych — każdy PR to pełny przebieg CI z budową zdjęć.
    groups:
      astro-i-tailwind:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'tailwindcss'
          - '@tailwindcss/*'
        update-types: ['minor', 'patch']
      pozostale:
        patterns:
          - '*'
        update-types: ['minor', 'patch']
    commit-message:
      # Wychodzi np. "chore(deps): bump ..." i "chore(deps-dev): bump ..."
      prefix: 'chore'
      include: 'scope'

  # Aktualizacje akcji GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Warsaw'
    open-pull-requests-limit: 5
    assignees:
      - 'VigoWB'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore'
      include: 'scope'
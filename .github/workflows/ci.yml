name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # co poniedziałek 3:00 UTC — pełny przebieg (typy, wszystkie testy, build, Lighthouse)

# Build i testy niczego nie zapisują w repozytorium, a repo jest publiczne —
# token ma więc tylko prawo odczytu.
permissions:
  contents: read

# Etapy idą po kolei: typy i testy jednostkowe → testy integracyjne → testy e2e → build + Lighthouse.
# Każdy startuje dopiero, gdy poprzedni jest zielony (`needs`).
# Na końcu „Wynik” — to on jest wymaganym sprawdzeniem w regule gałęzi `main`:
# pull request da się scalić tylko przy zielonym „Wyniku”.
jobs:
  jednostkowe:
    name: Typy i testy jednostkowe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Wersja Node z pliku .node-version — ten sam plik czyta Cloudflare Pages.
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Sprawdzanie typów TypeScript, także w plikach .astro (astro check).
      # Nie potrzebuje zmiennych środowiskowych.
      - name: Type check
        run: npm run check

      # Vitest, tests/jednostkowe/ — pojedyncze moduły, bez sieci, sekundy.
      - name: Testy jednostkowe
        run: npm run test:jednostkowe

  integracyjne:
    name: Testy integracyjne
    needs: jednostkowe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Vitest, tests/integracyjne/ — kod builda z atrapą R2 i astro:assets, komponenty .astro
      # przez Container API. Bez sieci i bez sekretów.
      - name: Testy integracyjne
        run: npm run test:integracyjne

  e2e:
    name: Testy e2e
    needs: integracyjne
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Testy idą na osobnym buildzie z danymi testowymi: tests/dane/galeria.json, szare zdjęcia
      # z lokalnej atrapy R2, wynik w dist-testy/ (scripts/build-testowy.mjs). Nie potrzebują
      # prawdziwych zdjęć ani sekretów.
      - name: Build na danych testowych
        run: npm run build:testy

      # `npm run test:e2e` zbudowałby stronę testową drugi raz,
      # więc uruchamiamy same testy.
      - name: Run tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build i Lighthouse
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Prawdziwy build (prawdziwe zdjęcia z R2, do dist/) — sprawdza go Lighthouse.
      # Na stronę trafia osobny build, który robi Cloudflare Pages po scaleniu do main.
      # Uwaga: PUBLIC_R2_URL musi istnieć TAKŻE jako sekret Dependabota
      # (Settings → Secrets and variables → Dependabot). Przebiegi uruchomione
      # przez Dependabota nie widzą zwykłych sekretów Actions i bez tego
      # każdy jego PR kończy się tu błędem "Brak wymaganych zmiennych".
      - name: Build
        run: npm run build
        env:
          PUBLIC_FORMSPREE_ID: ${{ secrets.PUBLIC_FORMSPREE_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.PUBLIC_CF_BEACON_TOKEN }}
          PUBLIC_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
          PUBLIC_R2_URL: ${{ secrets.PUBLIC_R2_URL }}

      # Progi z lighthouserc.json (wydajność ≥ 90, dostępność = 100) mają
      # "error" — wynik poniżej progu zapala ten etap na czerwono i blokuje scalenie PR.
      # Sprawdza prawdziwy build (dist/), bo wydajność zależy od prawdziwych zdjęć.
      - name: Run Lighthouse
        run: npx lhci autorun

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7

  # Wymagane sprawdzenie w regule gałęzi `main`. Uruchamia się zawsze (`always()`),
  # bo pominięty etap GitHub liczy jako „Success” — gdyby „Wynik” zależał tylko od `needs`,
  # po błędzie wcześniejszego etapu zostałby pominięty i nie zablokowałby scalenia.
  # Zielony tylko wtedy, gdy każdy etap skończył się sukcesem (pominięty i anulowany = błąd).
  # Nowy etap CI = dopisać go do `needs` poniżej.
  wynik:
    name: Wynik
    needs: [jednostkowe, integracyjne, e2e, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sprawdzenie wszystkich etapów
        env:
          WYNIKI: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Wyniki etapów: $WYNIKI"
          for wynik in $WYNIKI; do
            if [ "$wynik" != "success" ]; then
              echo "::error::Co najmniej jeden etap CI nie przeszedł — szczegóły w etapie oznaczonym na czerwono."
              exit 1
            fi
          done

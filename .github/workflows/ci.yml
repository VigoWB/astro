name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday 3 AM UTC - run Lighthouse CI

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # needed for git log in sitemap

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Wersja Node z pliku .node-version — ten sam plik czyta Cloudflare Pages.
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Sprawdzanie typów TypeScript, także w plikach .astro (astro check).
      # Błąd typu = czerwone CI. Krok stoi przed pobieraniem przeglądarek,
      # żeby przy błędzie CI kończyło się szybko. Nie potrzebuje zmiennych środowiskowych.
      - name: Type check
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          PUBLIC_FORMSPREE_ID: ${{ secrets.PUBLIC_FORMSPREE_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.PUBLIC_CF_BEACON_TOKEN }}
          PUBLIC_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
          PUBLIC_R2_URL: ${{ secrets.PUBLIC_R2_URL }}

      - name: Run Lighthouse (continue on error)
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        continue-on-error: true

      # Strona jest już zbudowana w kroku "Build". `npm run test` zbudowałby ją
      # drugi raz (skrypt "pretest"), więc uruchamiamy same testy.
      - name: Run tests
        run: npx playwright test

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # co poniedziałek 3:00 UTC — pełny przebieg (build, Lighthouse, testy)

# Build i testy niczego nie zapisują w repozytorium, a repo jest publiczne —
# token ma więc tylko prawo odczytu.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Wersja Node z pliku .node-version — ten sam plik czyta Cloudflare Pages.
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Sprawdzanie typów TypeScript, także w plikach .astro (astro check).
      # Błąd typu = czerwone CI. Krok stoi przed pobieraniem przeglądarek,
      # żeby przy błędzie CI kończyło się szybko. Nie potrzebuje zmiennych środowiskowych.
      - name: Type check
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Uwaga: PUBLIC_R2_URL musi istnieć TAKŻE jako sekret Dependabota
      # (Settings → Secrets and variables → Dependabot). Przebiegi uruchomione
      # przez Dependabota nie widzą zwykłych sekretów Actions i bez tego
      # każdy jego PR kończy się tu błędem "Brak wymaganych zmiennych".
      - name: Build
        run: npm run build
        env:
          PUBLIC_FORMSPREE_ID: ${{ secrets.PUBLIC_FORMSPREE_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.PUBLIC_CF_BEACON_TOKEN }}
          PUBLIC_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
          PUBLIC_R2_URL: ${{ secrets.PUBLIC_R2_URL }}

      # Strona jest już zbudowana w kroku "Build". `npm run test` zbudowałby ją
      # drugi raz (skrypt "pretest"), więc uruchamiamy same testy.
      - name: Run tests
        run: npx playwright test

      # Progi z lighthouserc.json (wydajność ≥ 90, dostępność = 100) mają
      # "error" — dlatego ten krok ma zapalać CI na czerwono, gdy ich nie spełnia.
      # Stoi PO testach, żeby błąd Lighthouse nie zasłaniał wyniku testów.
      - name: Run Lighthouse
        run: npx lhci autorun

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7
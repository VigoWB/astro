<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Wiktor Brzeziński</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #eaf4f4;
      color: #171512;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .container { max-width: 400px; }
    h1 { font-size: 2rem; margin-bottom: 1rem; color: #171512; }
    p { color: #55625a; margin-bottom: 1.5rem; line-height: 1.6; }
    .icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.7; }
    a { color: #3a5a40; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" aria-hidden="true">📷</div>
    <h1>Jesteś offline</h1>
    <p>Nie masz połączenia z internetem. Niektóre funkcje mogą nie działać.</p>
    <p><a href="/" onclick="window.location.reload()">Spróbuj ponownie</a></p>
  </div>
</body>
</html>
